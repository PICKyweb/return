<!DOCTYPE html>
<html>
   <head>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <base target="_top">
   </head>
   <body>
      <iframe id="myFrame" style="position: absolute;top: 0;left: 0;width: 100%;height: 100%;border: 0;" src=""></iframe>

      <script>
         // 1. ลิงก์หลักของ Web App หน้า "คืน" (ไม่ต้องมี ?row= ต่อท้าย)
         const baseUrl = "https://script.google.com/macros/s/AKfycbxoHNsnASXrnePgZj98XwiOM5if6d4LIcDm5tu5OpxOHFflIQXqz0V6HMyWtNqxSPGF/exec";
         
         // 2. รับค่า ?row=... จากลิงก์ที่ถูกกดเข้ามา แล้วนำไปต่อท้ายให้ iframe อัตโนมัติ
         const urlParams = window.location.search;
         document.getElementById("myFrame").src = baseUrl + urlParams;
      </script>
   </body>
</html>
